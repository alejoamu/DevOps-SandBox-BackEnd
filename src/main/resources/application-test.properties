# =============================================================================
# Perfil "test": usado por la suite de pruebas de Newman.
# Levanta el backend con una base de datos H2 in-memory, semilla de datos
# mínima (usuario admin) y expone /actuator/shutdown para que el script pueda
# apagar limpiamente la JVM (asegurando el dump del archivo .exec de JaCoCo).
# =============================================================================

server.port=8080

# --- Datasource: H2 en modo PostgreSQL ---
spring.datasource.url=jdbc:h2:mem:devops_sandbox_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate no genera el schema: lo controlamos manualmente para poder
# emular columnDefinition="jsonb" (Postgres) como VARCHAR en H2.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.sql.init.schema-locations=classpath:test-data/schema.sql
spring.sql.init.data-locations=classpath:test-data/data.sql
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Permite POST /actuator/shutdown para apagar la JVM desde el runner.
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=health,info,shutdown

# OpenAPI: el path por defecto se conserva.
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs/ui

# --- Seguridad (sólo para tests; nunca usar en producción) ---
app.security.jwt.secret=test-secret-key-for-newman-suite-0123456789abcdef0123456789abcdef
app.security.jwt.expiration-ms=3600000
app.security.cors.allowed-origins=http://localhost:3000
